# Diagnostic only: preserve sensor pins and initialization timing.
# Paired with the zmk-usb-logging snippet; no USB keyboard HID on the peripheral.
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_LOG_LEVEL_WRN=y
CONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y
CONFIG_LOG_BUFFER_SIZE=16384
# Allow time to open the CDC serial port before draining initialization logs.
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=10000
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=8192
