# Low-rate diagnostics; per-burst DEBUG logs are deliberately disabled.
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_LOG_LEVEL_WRN=y
CONFIG_PMW3610_ALT_LOG_LEVEL_INF=y
CONFIG_PMW3610_ALT_PROFILE=y
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=10000
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=8192
