# Aggregate-only diagnostics, no per-key/per-packet DEBUG logging.
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_LOG_LEVEL_WRN=y
CONFIG_PROSPECTOR_PIPELINE_PROFILE=y
# Historical diagnostics retain the original scan behavior for valid A/B baselines.
CONFIG_PROSPECTOR_SPLIT_SCAN_POLICY=n
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=768
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=10000
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=2048
