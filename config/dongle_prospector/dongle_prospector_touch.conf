# Add AFTER the existing common/operator/no_sensor conf entries.
# Zephyr 4.1 touch integration (CST816T shares compatible 'hynitron,cst816s').
CONFIG_PROSPECTOR_TOUCH_UI=y
CONFIG_PROSPECTOR_RELEASE_TAG="T4-01"
CONFIG_PROSPECTOR_KEYMAP_LABEL="QWERTY"
CONFIG_INPUT=y
CONFIG_INPUT_CST816S=y
CONFIG_INPUT_CST816S_INTERRUPT=y
CONFIG_LV_Z_POINTER_INPUT=y

# No ambient light sensor; use manual brightness & existing &pbl behavior.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=65
CONFIG_PROSPECTOR_BRIGHTNESS_STEP=5

# 5-minute idle timeout; ZMK controls display blanking, Prospector backlight off.
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Partial draw buffer keeps the full RGB565 framebuffer out of RAM. The
# runtime layouts share a dedicated LVGL object heap.
CONFIG_LV_Z_VDB_SIZE=25
CONFIG_LV_Z_MEM_POOL_SIZE=49152
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_ZMK_STUDIO=n

# Used for on-device brightness preference persistence.
CONFIG_SETTINGS=y

# LVGL 9 widgets required by touch_settings.c
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_SLIDER=y
CONFIG_LV_USE_ROLLER=y
CONFIG_LV_USE_CANVAS=n
CONFIG_LV_USE_IMAGE=n
CONFIG_LV_USE_SPINNER=n
CONFIG_LV_USE_FONT_COMPRESSED=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_20=n

# Observed indicator order implies right = slot 0, left = slot 1. UI only.
CONFIG_PROSPECTOR_LEFT_PERIPHERAL_SLOT=1
